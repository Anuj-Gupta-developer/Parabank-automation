# Runs the ParaBank tests in headless Chrome on every push to main,
# then commits the new HTML report (docs/index.html) back to the repo so Render can host it.
name: ParaBank UI Tests

on:
  push:
    branches: [main]
    # The report commit only changes docs/, so this stops it from starting another run
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

# Lets the job push the report commit using the built-in GITHUB_TOKEN
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Google Chrome is pre-installed on ubuntu-latest; Selenium Manager downloads the matching driver
      - name: Run tests in headless Chrome
        run: mvn -B clean test -Dbrowser=chrome -Dheadless=true

      # always() = publish the report even when tests fail, so failures (with screenshots) are visible
      - name: Commit updated report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Update test report (run #${{ github.run_number }})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
